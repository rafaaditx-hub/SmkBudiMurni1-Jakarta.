      <text x="0" y="20" font-size="13" fill="#1e293b">Pada Tanggal: 14 Juli 2026</text>
      <text x="0" y="40" font-size="13" font-weight="bold" fill="#1e293b">Kepala SMK Budi Murni 1 Jakarta</text>
      
