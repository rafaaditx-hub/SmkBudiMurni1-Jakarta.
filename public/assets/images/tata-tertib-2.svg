    <g transform="translate(100, 0)">
      <text x="0" y="0" font-size="13" fill="#1e293b">Mengetahui,</text>
      <text x="0" y="20" font-size="13" font-weight="bold" fill="#1e293b">Wakil Bidang Kesiswaan</text>
